<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#0f1115">
  <title>Maison</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <section id="left">
      <div id="clock">
        <div id="time">--:--</div>
        <div id="date"></div>
      </div>

      <div id="weather">
        <div class="w-now">
          <div id="w-icon" class="w-icon"></div>
          <div class="w-main">
            <div id="w-temp" class="w-temp">--°</div>
            <div id="w-label" class="w-label">Chargement de la météo…</div>
          </div>
        </div>
        <div id="w-details" class="w-details"></div>
        <div id="w-hourly" class="w-hourly"></div>
      </div>
    </section>

    <section id="right">
      <div class="right-head">
        <h2>Appareils</h2>
        <span id="status" class="status"><span class="dot"></span><span id="status-text">…</span></span>
      </div>
      <div id="devices"></div>
    </section>
  </div>

  <div id="night"></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
