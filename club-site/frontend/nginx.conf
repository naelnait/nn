server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback: let react-router handle any unknown path client-side.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed asset filenames (Vite's build output) can be cached forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
