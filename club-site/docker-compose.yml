services:
  backend:
    build:
      context: ./backend
    ports:
      - "4000:4000"
    environment:
      CORS_ORIGIN: http://localhost:8080
      PORT: 4000
    volumes:
      # Named volume so the sqlite file survives a container recreate —
      # the image itself ships no data, only migrations + the JSON seed.
      - backend-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4000/api/v1
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend-data:
